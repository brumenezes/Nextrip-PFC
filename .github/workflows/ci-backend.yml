name: CI Backend

on:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt (descomente quando criar o arquivo)

      - name: Checagem de Lint (Qualidade do Código)
        run: |
          # Adicione o comando da sua ferramenta (ex: flake8, black, ruff)
          echo "Executando linting..."

      - name: Testes e Validação do Serviço
        run: |
          # Adicione o comando de testes do FastAPI/LangGraph (ex: pytest)
          echo "Executando testes automatizados..."