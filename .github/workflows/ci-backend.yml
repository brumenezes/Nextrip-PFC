name: CI Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [develop, release, main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: nextrip_user
  POSTGRES_PASSWORD: ci_only_password
  POSTGRES_DB: nextrip_db
  DATABASE_URL: postgresql+psycopg://nextrip_user:ci_only_password@localhost:5433/nextrip_db
  TEST_DATABASE_URL: postgresql+psycopg://nextrip_user:ci_only_password@localhost:5433/nextrip_test_db
  JWT_SECRET_KEY: ci-only-secret-not-used-outside-actions
  JWT_EXPIRE_MINUTES: 60

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build and start PostgreSQL
        run: docker compose up -d --build

      - name: Wait for PostgreSQL
        run: |
          for _ in {1..30}; do
            if docker exec nextrip_db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Prepare test database
        run: |
          docker exec nextrip_db createdb -U "$POSTGRES_USER" nextrip_test_db
          docker exec nextrip_db psql -U "$POSTGRES_USER" -d nextrip_test_db -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          docker exec nextrip_db psql -U "$POSTGRES_USER" -d nextrip_test_db -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Apply migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic -c alembic_test.ini upgrade head

      - name: Compile application
        working-directory: backend
        run: python -m compileall -q app

      - name: Validate bundled OSM catalog
        working-directory: backend
        run: python -m scripts.importar_catalogo_osm data/catalogo_osm_teste.json --validate-only

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Stop services
        if: always()
        run: docker compose down -v
