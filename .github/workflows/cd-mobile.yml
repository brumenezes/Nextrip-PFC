name: Delivery Mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma do build
        required: true
        default: all
        type: choice
        options: [all, android, ios]
      profile:
        description: Perfil EAS
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: delivery-mobile-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.profile }}
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require delivery configuration
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Configure o secret EXPO_TOKEN no ambiente selecionado.'; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo 'Configure a variável EXPO_PUBLIC_API_URL no ambiente selecionado.'; exit 1; }

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Revalidate source
        run: |
          npm run typecheck
          npm run lint
          npm run doctor

      - name: Configure Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Request signed cloud build
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
