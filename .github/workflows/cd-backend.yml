name: Delivery Backend

on:
  workflow_run:
    workflows: ['CI Backend']
    types: [completed]
    branches: [develop, release, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-backend-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextrip-api
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
