
services:
  db:
    build:
      context: ./infra
      dockerfile: Dockerfile
    image: nextrip-postgres:local
    container_name: nextrip_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextrip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-nextrip_db}

    ports:
      - "5433:5432"

    volumes:
      - nextrip_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  nextrip_data:
